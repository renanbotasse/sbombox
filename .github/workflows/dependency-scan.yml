name: SBOMBox

on:
  pull_request:
    paths:
      - "**/poetry.lock"
      - "**/uv.lock"
      - "**/Pipfile.lock"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".vulnignore"
      - "scripts/sbom_scan.py"
      - ".github/workflows/dependency-scan.yml"
  push:
    branches: [main, master]
    paths:
      - "**/poetry.lock"
      - "**/uv.lock"
      - "**/Pipfile.lock"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".vulnignore"
      - "scripts/sbom_scan.py"
      - ".github/workflows/dependency-scan.yml"
  schedule:
    # Weekdays 06:00 UTC
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  # Needed for GitHub Advisory Database queries
  security-events: read

jobs:
  scan:
    name: SBOMBox scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve scan root
        id: root
        run: |
          # Prefer an app/ subfolder when that is where lock files live.
          if [ -f backend/poetry.lock ] || [ -f backend/uv.lock ] || [ -f backend/Pipfile.lock ] || [ -f backend/requirements.txt ]; then
            echo "path=backend" >> "$GITHUB_OUTPUT"
          elif [ -f app/poetry.lock ] || [ -f app/uv.lock ] || [ -f app/Pipfile.lock ] || [ -f app/requirements.txt ]; then
            echo "path=app" >> "$GITHUB_OUTPUT"
          elif [ -f poetry.lock ] || [ -f uv.lock ] || [ -f Pipfile.lock ] || [ -f requirements.txt ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Run SBOMBox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python scripts/sbom_scan.py "${{ steps.root.outputs.path }}" \
            -o sbom-report \
            --fail-on high \
            --vulnignore .vulnignore

      - name: Write job summary
        if: always()
        run: |
          if [ -f sbom-report/vuln-report.md ]; then
            cat sbom-report/vuln-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No vuln-report.md produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SBOM report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom-report/
          retention-days: 30
          if-no-files-found: warn
