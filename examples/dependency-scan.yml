# Copy this file into YOUR application repo as:
#   .github/workflows/dependency-scan.yml
#
# Requires the sBOMBox package in that repo (sbombox/) or adjust PYTHONPATH / install step.
# Optional secret: NVD_API_KEY

name: sBOMBox

on:
  pull_request:
    paths:
      - "**/poetry.lock"
      - "**/uv.lock"
      - "**/Pipfile.lock"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".vulnignore"
      - "sbombox/**"
      - ".github/workflows/dependency-scan.yml"
  push:
    branches: [main, master]
    paths:
      - "**/poetry.lock"
      - "**/uv.lock"
      - "**/Pipfile.lock"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - ".vulnignore"
      - "sbombox/**"
      - ".github/workflows/dependency-scan.yml"
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  scan:
    name: sBOMBox scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve scan root
        id: root
        run: |
          if [ -f backend/poetry.lock ] || [ -f backend/uv.lock ] || [ -f backend/Pipfile.lock ] || [ -f backend/requirements.txt ]; then
            echo "path=backend" >> "$GITHUB_OUTPUT"
          elif [ -f app/poetry.lock ] || [ -f app/uv.lock ] || [ -f app/Pipfile.lock ] || [ -f app/requirements.txt ]; then
            echo "path=app" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Run sBOMBox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m sbombox "${{ steps.root.outputs.path }}" \
            -o sbom-report \
            --fail-on high \
            --vulnignore .vulnignore

      - name: Write job summary
        if: always()
        run: |
          if [ -f sbom-report/sbom-report.md ]; then
            cat sbom-report/sbom-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No sbom-report.md produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SBOM report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom-report/
          retention-days: 30
          if-no-files-found: warn
