[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbombox"
dynamic = ["version"]
description = "CycloneDX SBOM generator and Python dependency vulnerability scanner (stdlib only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sbom", "cyclonedx", "security", "vulnerability", "scanner", "osv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sbombox = "sbombox.cli:main"

[tool.setuptools.packages.find]
include = ["sbombox*"]

[tool.setuptools.dynamic]
version = { attr = "sbombox.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "E9"]
